syntax = "proto3";

package litrpc;

option go_package = "github.com/lightninglabs/lightning-terminal/litrpc";

// LLMService exposes endpoints for LLM-based node analysis.
service LLM {
    // AnalyzeNode performs LLM analysis on the node's current state.
    rpc AnalyzeNode (AnalyzeNodeRequest) returns (stream AnalyzeNodeResponse);
}

message AnalyzeNodeRequest {
    // query is the natural language query to analyze the node data.
    string query = 1;
}

message AnalyzeNodeResponse {
    // analysis contains the natural language analysis response chunk.
    string analysis = 1;

    // done indicates if this is the final chunk of the response.
    bool done = 2;
}
